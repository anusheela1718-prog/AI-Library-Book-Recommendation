<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - AI Library</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav"><div class="container">
    <a class="brand" href="index.html"><span class="mark">AI</span>Library<span class="accent"></span></a>
  </div></nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to see your personalized recommendations.</p>
      <div id="form-error" class="notice error" style="display:none" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="loginId">Student ID or Email</label>
          <input type="text" id="loginId" name="loginId" placeholder="ST001 or you@example.com" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-field">
            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pw-toggle">Show</button>
          </div>
        </div>
        <div class="remember-row">
          <label><input type="checkbox" id="remember" checked style="width:auto"> Remember me</label>
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-block btn-lg" id="submit-btn">Sign In</button>
      </form>
      <p class="auth-foot">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
