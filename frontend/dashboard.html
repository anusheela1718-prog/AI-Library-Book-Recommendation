<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - AI Library</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-head"><div class="container">
      <div class="welcome-banner">
        <div>
          <h1 id="welcome-name">Welcome back</h1>
          <p>Discover books personalized to your interests, subjects and reading history.</p>
        </div>
        <div class="welcome-actions">
          <a class="btn" style="background:var(--accent);border-color:var(--accent);color:var(--ink)" href="recommendations.html">Get Recommendations</a>
          <a class="btn btn-outline" href="browse-books.html">Browse Books</a>
        </div>
      </div>
    </div></section>

    <section><div class="container">
      <div class="stat-grid" id="stat-grid">
        <div class="card stat-card"><div class="num">&hellip;</div><div class="label">Total Books</div></div>
        <div class="card stat-card"><div class="num">&hellip;</div><div class="label">Recommended For You</div></div>
        <div class="card stat-card"><div class="num">&hellip;</div><div class="label">Books Read</div></div>
        <div class="card stat-card"><div class="num">&hellip;</div><div class="label">Interests Selected</div></div>
      </div>

      <div class="section-title"><h2>Recommended For You</h2><a href="recommendations.html">See all &rarr;</a></div>
      <div id="rec-status"></div>
      <div class="mini-grid" id="rec-preview"></div>
    </div></section>
  </main>
  <footer><div id="footer" class="container"></div></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
