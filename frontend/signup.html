<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account - AI Library</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav"><div class="container">
    <a class="brand" href="index.html"><span class="mark">AI</span>Library</a>
  </div></nav>

  <main class="auth-wrap">
    <div class="auth-card wide">
      <h1>Create your account</h1>
      <p class="sub">Tell us your interests so recommendations start personalized on day one.</p>
      <div id="form-error" class="notice error" style="display:none" role="alert"></div>
      <form id="signup-form" novalidate>
        <div class="form-grid">
          <div class="field"><label for="studentId">Student ID</label><input type="text" id="studentId" placeholder="e.g. ST101" maxlength="20" autocomplete="off" required></div>
          <div class="field"><label for="name">Full Name</label><input type="text" id="name" placeholder="Your full name" maxlength="80" required></div>
          <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
          <div class="field"><label for="department">Department</label><input type="text" id="department" placeholder="BCA" maxlength="60" value="BCA"></div>
          <div class="field"><label for="year">Year</label>
            <select id="year"><option value="1">1st year</option><option value="2">2nd year</option><option value="3" selected>3rd year</option><option value="4">4th year</option></select>
          </div>
          <div class="field pw-field"><label for="password">Password</label><input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required></div>
          <div class="field pw-field"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password" required></div>
        </div>

        <p style="font-weight:700;margin:1.2rem 0 .4rem">Your interests</p>
        <div class="chips" id="interest-chips"></div>
        <div class="field" style="margin-top:.7rem"><label for="extraInterests">Other interests (comma separated)</label>
          <input type="text" id="extraInterests" placeholder="e.g. Docker, Arduino"></div>

        <p style="font-weight:700;margin:1.2rem 0 .4rem">Subjects</p>
        <div class="chips" id="subject-chips"></div>

        <button type="submit" class="btn btn-block btn-lg" id="submit-btn" style="margin-top:1.4rem">Create Account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="login.html">Back to Sign In</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
