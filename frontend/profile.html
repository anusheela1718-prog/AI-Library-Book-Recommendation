<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - AI Library</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-head"><div class="container">
      <h1>Profile</h1>
    </div></section>
    <section><div class="container">
      <div class="card">
        <div class="profile-head">
          <div class="avatar-lg" id="profile-avatar">?</div>
          <div><h2 id="profile-name" style="margin-bottom:.1rem">&nbsp;</h2><p class="id" id="profile-id"></p></div>
        </div>
        <div class="card-pad" style="padding-top:0">
          <div id="view-mode">
            <dl class="profile-list">
              <dt>Email</dt><dd id="v-email"></dd>
              <dt>Department</dt><dd id="v-department"></dd>
              <dt>Year</dt><dd id="v-year"></dd>
              <dt>Interests</dt><dd id="v-interests"></dd>
              <dt>Subjects</dt><dd id="v-subjects"></dd>
            </dl>
            <div class="field-row" style="margin-top:1rem;gap:.7rem">
              <button class="btn" id="edit-btn">Edit Profile</button>
              <button class="btn btn-danger" id="logout-btn2">Logout</button>
            </div>
          </div>

          <form id="edit-form" style="display:none">
            <div class="form-grid">
              <div class="field"><label for="e-name">Full Name</label><input type="text" id="e-name" maxlength="80" required></div>
              <div class="field"><label for="e-department">Department</label><input type="text" id="e-department" maxlength="60"></div>
              <div class="field"><label for="e-year">Year</label>
                <select id="e-year"><option value="1">1st year</option><option value="2">2nd year</option><option value="3">3rd year</option><option value="4">4th year</option></select>
              </div>
            </div>
            <p style="font-weight:700;margin:1.1rem 0 .4rem">Interests</p>
            <div class="chips" id="e-interest-chips"></div>
            <div class="field" style="margin-top:.6rem"><label for="e-extra">Other interests (comma separated)</label><input type="text" id="e-extra"></div>
            <p style="font-weight:700;margin:1.1rem 0 .4rem">Subjects</p>
            <div class="chips" id="e-subject-chips"></div>
            <div id="edit-error" class="notice error" style="display:none;margin-top:1rem"></div>
            <div class="field-row" style="margin-top:1.2rem;gap:.7rem">
              <button type="submit" class="btn" id="save-btn">Save Changes</button>
              <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div></section>
  </main>
  <footer><div id="footer" class="container"></div></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
