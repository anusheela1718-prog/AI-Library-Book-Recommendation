<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Books - AI Library</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/books.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-head"><div class="container">
      <div class="section-title"><h1>Browse Books</h1><p class="hint" id="result-count"></p></div>
      <div class="toolbar">
        <input type="search" id="browse-search" placeholder="Search by title, author or subject" aria-label="Search books">
        <select id="browse-category" aria-label="Filter by category"><option value="">All categories</option></select>
        <select id="browse-sort" aria-label="Sort books">
          <option value="title">Sort: Title (A-Z)</option>
          <option value="author">Sort: Author (A-Z)</option>
          <option value="subject">Sort: Subject</option>
        </select>
      </div>
    </div></section>
    <section><div class="container">
      <div id="browse-status"></div>
      <div class="book-grid" id="browse-grid"></div>
    </div></section>
  </main>
  <footer><div id="footer" class="container"></div></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
